<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A"/>
      <stop offset="100%" stop-color="#181B29"/>
    </linearGradient>

    <!-- Syntax-to-Sound Vibrant Gradient -->
    <linearGradient id="sesiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="45%" stop-color="#00BBF9"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Tile: High contrast, dark rounded squircle -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border for contrast on dark browser tabs -->
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Main Symbol: Code bracket '<' fused into an eighth note stem & beam, with an embedded waveform pulse -->
  <g filter="url(#glow)">
    <!-- Connected Code Bracket / Note Flow -->
    <path d="M 33 29
             L 19 46.5
             Q 16 50.5 19 54.5
             L 33 72" 
          fill="none" 
          stroke="url(#sesiGrad)" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Note Stem & Beam, aligned to complete code-music metaphor -->
    <path d="M 68 81
             V 26
             Q 68 20 74 20
             L 81 20" 
          fill="none" 
          stroke="url(#sesiGrad)" 
          stroke-width="9.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Waveform / Frequency Bars -->
    <path d="M 39 37.5 V 63.5" 
          stroke="url(#sesiGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round"/>
    
    <path d="M 53 28 V 73" 
          stroke="url(#sesiGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round"/>

    <!-- Musical Note Head at the base of the stem -->
    <circle cx="56.5" cy="80.5" r="9.5" fill="url(#sesiGrad)"/>
  </g>
</svg>